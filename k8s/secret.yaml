# =============================================================================
# DEFINITION (সংজ্ঞা):
# Secret হলো কুবারনেটিসের একটি অবজেক্ট যা পাসওয়ার্ড, টোকেন বা চাবির মতো 
# সংবেদনশীল (Sensitive) তথ্যগুলোকে নিরাপদে স্টোর করে রাখে। 
# ConfigMap-এর সাথে এর মূল পার্থক্য হলো—Secret-এর ডাটাগুলো সরাসরি প্লেইন টেক্সটে থাকে না, 
# এগুলো Base64 ফরম্যাটে এনকোড করা থাকে যাতে কেউ সরাসরি ফাইলটি খুললে পাসওয়ার্ড দেখতে না পায়।
# =============================================================================

# ১. apiVersion: কুবারনেটিস অবজেক্টের ভার্সন। 
# Secret একটি কোর অবজেক্ট, তাই এর ভার্সন 'v1'।
apiVersion: v1

# ২. kind: অবজেক্ট টাইপ। এখানে 'Secret' মানে এটি গোপন তথ্য সংরক্ষণের জন্য।
kind: Secret

# ৩. metadata: এই সেকশনে সিক্রেটের পরিচিতি থাকে।
metadata:
  # name: এই সিক্রেট অবজেক্টের নাম। আপনার প্রজেক্টে এটি 'rms-db-secret'।
  # Deployment ফাইলে পাসওয়ার্ড কল করার সময় এই নামটি ব্যবহার করতে হবে।
  name: rms-db-secret
  
  # namespace: এটি অবশ্যই আপনার 'automation' নেমস্পেসের অধীনে থাকতে হবে।
  namespace: automation

# ৪. type: সিক্রেটের ধরন।
# 'Opaque' হলো ডিফল্ট টাইপ। এর মানে হলো এটি যেকোনো সাধারণ টেক্সট বা ফাইল (যেমন পাসওয়ার্ড) 
# গোপন রাখার জন্য ব্যবহৃত হচ্ছে।
type: Opaque

# ৫. data: এখানে আসল গোপন তথ্যগুলো Key-Value আকারে থাকে।
# মনে রাখবেন: এখানে ভ্যালুগুলো সরাসরি লেখা যায় না, অবশ্যই Base64 এনকোড করে দিতে হয়।
data:
  # db-password: আপনার ডাটাবেসের আসল পাসওয়ার্ডের এনকোডেড রূপ।
  # এখানে 'cm1zX3VzZXJAMzIx' মানে হলো 'rms_user@321' (Base64 encoded)।
  db-password: cm1zX3VzZXJAMzIx