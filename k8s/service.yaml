# =============================================================================
# DEFINITION (সংজ্ঞা):
# Service হলো একটি স্থির (Static) নেটওয়ার্ক গেটওয়ে। কুবারনেটিসে পডগুলো মাঝে মাঝে 
# রিস্টার্ট হয় এবং তাদের আইপি (IP) অ্যাড্রেস বদলে যায়। সার্ভিস ফাইলটি নিশ্চিত করে যে 
# পডের আইপি যাই হোক না কেন, ইউজাররা যেন সবসময় একটি নির্দিষ্ট পোর্ট বা লিঙ্কে 
# আপনার অ্যাপ্লিকেশনটি খুঁজে পায়। এটি মূলত একটি "Load Balancer" হিসেবে কাজ করে।
# =============================================================================

# ১. apiVersion: কুবারনেটিস অবজেক্টের ভার্সন। 
apiVersion: v1

# ২. kind: অবজেক্ট টাইপ। এখানে 'Service' মানে এটি নেটওয়ার্কিং বা পোর্ট ওপেন করার ফাইল।
kind: Service

# ৩. metadata: এই সেকশনে সার্ভিসের নিজস্ব পরিচয় থাকে।
metadata:
  # name: এই সার্ভিসের নাম। 
  # মাইক্রোসার্ভিস আর্কিটেকচারে অন্য সার্ভিসগুলো এই নাম ব্যবহার করেই একে খুঁজে পাবে।
  name: recruitment-requisition-service
  # namespace: আপনার তৈরি করা ভার্চুয়াল ঘর 'automation'।
  namespace: auto

# ৪. spec (Specification): এখানে আপনি বলছেন ট্রাফিক কীভাবে আপনার অ্যাপে পৌঁছাবে।
spec:
  # selector: এটি এই সার্ভিসের সবচেয়ে গুরুত্বপূর্ণ অংশ।
  # এটি বলে দেয় এই সার্ভিসটি কোন পডগুলোর জন্য গেটওয়ে হিসেবে কাজ করবে।
  # আপনার deployment.yaml ফাইলে 'app: recruitment-service' লেবেলটি দেওয়া ছিল, 
  # তাই এখানেও সেটিই ব্যবহার করা হয়েছে যাতে সার্ভিসটি সঠিক পডকে খুঁজে পায়।
  selector:
    app: recruitment-service

  # type: সার্ভিসের ধরন।
  # 'LoadBalancer' মানে হলো এটি আপনার ক্লাউড প্রোভাইডার বা লোকাল এনভায়রনমেন্ট থেকে 
  # একটি এক্সটারনাল আইপি (External IP) তৈরি করবে যাতে আপনি বাইরে থেকে অ্যাপটি অ্যাক্সেস করতে পারেন।
  type: LoadBalancer

  # ৫. ports: এখানে পোর্টের ম্যাপিং করা হয়।
  ports:
    - name: http           # এই পোর্ট কনফিগারেশনের একটি নাম।
      protocol: TCP        # ইন্টারনেটে ডেটা আদান-প্রদানের স্ট্যান্ডার্ড প্রোটোকল।
      
      # port: এটি হলো বাইরের জগতের জন্য পোর্ট। 
      # আপনি ব্রাউজারে বা পোস্টম্যানে এই পোর্টে হিট করবেন (যেমন: http://localhost:8005)।
      port: 8001
      
      # targetPort: এটি হলো আপনার পডের ভেতরের পোর্ট। 
      # সার্ভিসটি ট্রাফিক গ্রহণ করে পডের ভেতরে এই পোর্টে পাঠিয়ে দিবে। 
      # এটি অবশ্যই আপনার Deployment এবং Dockerfile-এর পোর্টের সাথে মিলতে হবে।
      targetPort: 8001