# =============================================================================
# DEFINITION (সংজ্ঞা):
# ConfigMap হলো কুবারনেটিসের একটি অবজেক্ট যা আপনার অ্যাপ্লিকেশনের "নন-সেনসিটিভ" (Non-sensitive)
# বা সাধারণ কনফিগারেশন ডাটা (যেমন: URL, Port, Hostname) পড থেকে আলাদা করে সেভ করে রাখে।
# এর ফলে কোড পরিবর্তন না করেই আপনি ডাটাবেস ইউআরএল বা অন্য কোনো সেটিংস পরিবর্তন করতে পারেন।
# =============================================================================

# ১. apiVersion: কুবারনেটিস অবজেক্টের ভার্সন।
# ConfigMap একটি স্ট্যান্ডার্ড অবজেক্ট, তাই এর ভার্সন 'v1'।
apiVersion: v1

# ২. kind: অবজেক্ট টাইপ। এখানে 'ConfigMap' মানে এটি শুধুমাত্র তথ্য বা ডাটা স্টোর করার জন্য।
kind: ConfigMap

# ৩. metadata: এই সেকশনে কনফিগম্যাপের পরিচিতি থাকে।
metadata:
  # name: এই কনফিগম্যাপের নাম। আপনার প্রজেক্টে এটি 'rms-config'।
  # আপনার deployment.yaml ফাইলে এই নাম ব্যবহার করেই সব ডাটা পডের ভেতরে নেওয়া হবে।
  name: rms-config

  # namespace: এটি অবশ্যই আপনার আগে তৈরি করা 'automation' নেমস্পেসের সাথে মিলতে হবে।
  # নেমস্পেস আলাদা হলে পড এই কনফিগম্যাপটি খুঁজে পাবে না।
  namespace: automation

# ৪. data: এখানে আপনার আসল কনফিগারেশনগুলো Key-Value আকারে থাকে।
# আপনার স্প্রিং বুট অ্যাপের application.properties ফাইলে এই ভ্যালুগুলো ইনজেক্ট করা হবে।
data:
  # DB_URL: আপনার পোস্টগ্রেস (PostgreSQL) ডাটাবেসের কানেকশন স্ট্রিং।
  DB_URL: "jdbc:postgresql://103.147.56.152:5432/rms_db"

  # DB_USER: ডাটাবেসে লগইন করার ইউজারনেম।
  DB_USER: "rms_user"

  # EUREKA_URL: মাইক্রোসার্ভিস রেজিস্ট্রি বা ইউরেকা সার্ভারের ঠিকানা।
  # এখানে 'localhost' দেওয়া আছে, যা সার্ভিসগুলো আলাদা পডে থাকলে পরিবর্তন করা লাগতে পারে।
  EUREKA_URL: "http://localhost:8761/eureka/"

  # APP_PORT: আপনার এই নির্দিষ্ট সার্ভিসটি যে পোর্টে রান করবে।
  APP_PORT: "8005"