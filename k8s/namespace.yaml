# =============================================================================
# DEFINITION (সংজ্ঞা):
# Namespace হলো কুবারনেটিস ক্লাস্টারের ভেতরে একটি "ভার্চুয়াল এরিয়া" বা "বিচ্ছিন্ন ঘর"।
# এটি একটি বড় ক্লাস্টারকে ছোট ছোট ভাগে ভাগ করে যাতে এক প্রজেক্টের রিসোর্স (Pods, Services)
# অন্য প্রজেক্টের সাথে মিশে না যায়। এটি মূলত কাজের পরিবেশ (Dev, Test, Prod) আলাদা রাখতে ব্যবহৃত হয়।
# =============================================================================

# ১. apiVersion: কুবারনেটিস অবজেক্টের ভার্সন।
# Namespace একটি কোর (Core) অবজেক্ট, তাই এর ভার্সন সবসময় 'v1' হয়।
apiVersion: v1

# ২. kind: আপনি কুবারনেটিসকে বলছেন যে আপনি একটি "Namespace" তৈরি করতে চান।
# এটি কুবারনেটিসকে নির্দেশ দেয় যে এই ফাইলের ডাটা দিয়ে একটি ভার্চুয়াল বাউন্ডারি তৈরি করতে হবে।
kind: Namespace

# ৩. metadata: এই সেকশনে অবজেক্টের পরিচিতি থাকে।
metadata:
  # name: এটিই আপনার তৈরি করা নেমস্পেসের আসল এবং ইউনিক নাম।
  # 'automation' নাম দেওয়ার ফলে এই প্রজেক্টের সব ফাইল এখন এই নামের অধীনে থাকবে।
  # মনে রাখবেন: একটি ক্লাস্টারে একই নামে দুটি নেমস্পেস থাকতে পারে না।
  name: auto